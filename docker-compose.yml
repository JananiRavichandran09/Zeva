services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zeva
      POSTGRES_PASSWORD: zeva
      POSTGRES_DB: zeva
    ports:
      - "5432:5432"
    volumes:
      - zeva_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeva"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  zeva_pg:
